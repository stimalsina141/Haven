<!DOCTYPE html>
<html>
<head>
    <title>Login - Haven</title>
</head>
<body>
    <h2>Login to Haven</h2>
    <form method = "POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type = "submit">Login</button>
    </form>
    <p>Don't have an account? <a href = "{% url 'signup' %}">Sign Up</a></p>
</body>
</html>
