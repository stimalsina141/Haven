<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Haven</title>
</head>
<body>
    <h2>Sign Up for Haven</h2>
    <form method = "POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type = "submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href = "{% url 'login' %}">Login</a></p>
</body>
</html>
